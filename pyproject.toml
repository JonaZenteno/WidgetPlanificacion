[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "widget-dashboard"
version = "0.1.0"
description = "Widget de escritorio minimalista para productividad personal en Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jona" }
]
dependencies = [
  "plyer>=2.1.0",
  "pywin32>=306; platform_system == 'Windows'",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["widget_dashboard*"]

[tool.unittest]
start-dir = "tests"
